# GitHub Actions template: publish robot folders to Sema4.ai v3 task packages.
#   Push to main         -> DEV packages, for each mapped folder that changed.
#   Tag <release>/v1.2.0 -> PROD packages, after approval in the v3-prod environment.
#
# Copy to .github/workflows/ with taskpackage_sync.py and v3-packages.yaml, and adjust the
# branch, the paths filter and SYNC_DIR to your layout.
#
# Settings > Environments: create v3-dev and v3-prod. On v3-prod add required reviewers and
# limit deployments to tags matching "*/v*" and "v*".
# Each environment (or the repository, when DEV and PROD share one credential):
#   Secret    V3_RCC_CREDENTIALS  rcc access credential (identifier:secret)
#   Variable  V3_URL              e.g. https://us3.sema4.ai
name: Task package git sync

on:
  push:
    branches: [main]
    tags: ["*/v*", "v*"]          # path filters don't apply to tags
    paths:
      - "robots/**"               # your robot folders
      - "taskpackage-git-sync/v3-packages.yaml"
  workflow_dispatch:              # from main: every DEV folder; from a tag: that release to PROD

concurrency:
  group: taskpackage-git-sync-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SYNC_DIR: taskpackage-git-sync

jobs:
  dev:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: v3-dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish to DEV
        env:
          V3_URL: ${{ vars.V3_URL }}
          V3_RCC_CREDENTIALS: ${{ secrets.V3_RCC_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            "$SYNC_DIR/taskpackage_sync.py" --environment dev --base "${{ github.event.before }}"
          else
            "$SYNC_DIR/taskpackage_sync.py" --environment dev --all
          fi

  prod:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: v3-prod
    steps:
      - uses: actions/checkout@v5
      - name: Publish to PROD
        env:
          V3_URL: ${{ vars.V3_URL }}
          V3_RCC_CREDENTIALS: ${{ secrets.V3_RCC_CREDENTIALS }}
        run: '"$SYNC_DIR/taskpackage_sync.py" --environment prod --tag "${{ github.ref_name }}"'
