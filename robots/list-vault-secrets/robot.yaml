# For more details on the format and content:
# https://github.com/robocorp/rcc/blob/master/docs/recipes.md#what-is-in-robotyaml

tasks:
  Print Secret:
    shell: python -m robocorp.tasks run tasks.py -t print_secret
  Get All Assets:
    shell: python -m robocorp.tasks run tasks.py -t get_all_assets
  Print Run Details:
    shell: python -m robocorp.tasks run tasks.py -t print_run_details
  Write Asset:
    shell: python -m robocorp.tasks run tasks.py -t write_asset
  Delete Asset:
    shell: python -m robocorp.tasks run tasks.py -t delete_asset
  Write Secret:
    shell: python -m robocorp.tasks run tasks.py -t write_secret

environmentConfigs:
  - environment_windows_amd64_freeze.yaml
  - environment_linux_amd64_freeze.yaml
  - environment_darwin_amd64_freeze.yaml
  - conda.yaml

artifactsDir: output

PATH:
  - .
PYTHONPATH:
  - .
ignoreFiles:
  - .gitignore
